aid: affineon-health
name: Affineon Health
description: 'Affineon Health is a healthcare AI company whose product is an AI inbox
  agent that works inside a clinician''s existing EHR inbox rather than as a separate
  application. Two modules ship today: Labs Core, which routes CC''d results away from
  the provider, groups incomplete lab sets until they are ready, auto-processes normal
  and clinically insignificant results, trends and summarizes the chart, and drafts the
  patient message; and Rx Renewals, which clears prescription renewal requests that meet
  a practice protocol and escalates the rest for physician review. A third offering,
  Affineon Embed, is a white-label program letting EHR vendors, AI scribes and other
  health-technology companies bundle the same inbox agent into their own products —
  Commure is a named participant. Affineon reaches practices chiefly through the
  athenahealth Marketplace, states it is SOC 2 and HIPAA compliant, and publishes
  per-provider subscription pricing. It publishes no developer portal, API reference,
  SDK or machine-readable specification of any kind: the company is a consumer of EHR
  APIs, and its own integration surface is quoted through a Request Access form.'
