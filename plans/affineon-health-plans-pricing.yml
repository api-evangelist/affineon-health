name: Affineon Health Plans and Pricing
description: >-
  Published per-provider subscription pricing for Affineon's two clinical inbox
  modules, read verbatim from the pricing table Affineon publishes on its Labs Core
  and Rx Renewals product pages. Pricing is banded by the number of providers in the
  practice, with a per-provider monthly price for a single module and a lower blended
  per-provider price for the Labs + Rx bundle. There is no self-serve checkout and no
  published API pricing — these are seat prices for the end-user product, sold through
  a demo request.
